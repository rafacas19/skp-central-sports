# Render Blueprint — deploy with: Render Dashboard → New → Blueprint → this repo.
# Provisions a managed Postgres + a Dockerized FastAPI web service that hosts the
# Telegram bot (webhook mode) and the read API.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: scouting-db
    plan: basic-256mb        # smallest paid managed Postgres; free tier expires after 30 days
    databaseName: scouting
    user: scouting

services:
  - type: web
    name: skp-central-sports
    runtime: docker          # build from the Dockerfile (FastAPI + uvicorn)
    dockerfilePath: ./Dockerfile
    plan: starter            # webhook mode needs an always-on instance (free spins down)
    region: oregon           # change to your nearest region
    healthCheckPath: /healthz # FastAPI health endpoint
    autoDeploy: true
    envVars:
      # ── Database: injected from the managed Postgres above ──────────────
      - key: DATABASE_URL
        fromDatabase:
          name: scouting-db
          property: connectionString

      # ── Webhook runtime ────────────────────────────────────────────────
      # WEBHOOK_BASE_URL is intentionally NOT declared here: config.py falls back
      # to RENDER_EXTERNAL_URL, which Render auto-injects with the full https URL.
      # (Avoids the first-deploy race where a fromService host isn't resolvable
      # yet, which would silently start the bot in polling mode.)
      - key: WEBHOOK_SECRET
        generateValue: true       # Render generates a random secret
      # PORT is set automatically by Render; config.py reads it.

      # ── REST read API auth ──────────────────────────────────────────────
      - key: API_KEY
        generateValue: true       # required in X-API-Key for /sessions endpoints

      # ── Dashboard (/dashboard web UI) ───────────────────────────────────
      # Until DASHBOARD_PASSWORD is set in the Render dashboard, /dashboard
      # returns 503 (disabled). The secret signs the session cookie.
      - key: DASHBOARD_PASSWORD
        sync: false               # choose a password in the dashboard (secret)
      - key: DASHBOARD_SECRET
        generateValue: true

      # ── Telegram ───────────────────────────────────────────────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false               # set in the dashboard (secret)

      # ── AI mode ────────────────────────────────────────────────────────
      # Start mocked (no keys needed) to verify the deploy, then flip to false
      # and fill the keys below in the dashboard to go live.
      - key: USE_MOCK_AI
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIBE_MODEL
        value: whisper-1

      # ── Behaviour ──────────────────────────────────────────────────────
      - key: CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: SESSION_NUDGE_MINUTES
        value: "120"
      # Note: Python is pinned by the Dockerfile (3.11.14); no PYTHON_VERSION here.
      # DB migrations run via entrypoint.sh (aerich upgrade) on each deploy.
