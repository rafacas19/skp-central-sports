{# Inline SVG icons, one stroke style (Lucide geometry, 2px, round caps). #}
{% macro icon(name, label=None) -%}
<svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true"{% endif %} focusable="false">
{%- if name == "menu" -%}<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == "close" -%}<path d="M18 6 6 18M6 6l12 12"/>
{%- elif name == "back" -%}<path d="m15 18-6-6 6-6"/>
{%- elif name == "more" -%}<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
{%- elif name == "ball" -%}<circle cx="12" cy="12" r="9"/><path d="m12 7.5 4.3 3.1-1.6 5h-5.4l-1.6-5z"/><path d="M12 3v4.5M20.6 9.4l-4.3 1.2M17.5 19.3l-2.8-3.7M6.5 19.3l2.8-3.7M3.4 9.4l4.3 1.2"/>
{%- elif name == "pitch" -%}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 12h16"/><circle cx="12" cy="12" r="2.5"/>
{%- elif name == "edit" -%}<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
{%- elif name == "list" -%}<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
{%- elif name == "flag" -%}<path d="M4 22V4"/><path d="M4 4h13l-2 4 2 4H4"/>
{%- elif name == "user" -%}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif name == "file" -%}<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6"/>
{%- elif name == "logout" -%}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>
{%- endif -%}
</svg>
{%- endmacro %}
